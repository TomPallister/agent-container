set -g default-terminal "screen-256color"
set -g mouse on

# Split panes: prefix + d (vertical), prefix + shift+d (horizontal)
bind d split-window -h -c "#{pane_current_path}"
bind D split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# New tab
bind t new-window -c "#{pane_current_path}"

# Close pane
bind x kill-pane

# Show cheatsheet on new session
set-hook -g session-created 'display-message -d 3000 "  tmux: Ctrl+b d=split-right  D=split-down  t=new-tab  x=close  Alt+arrows=navigate"'

# --- Alabaster-matched minimal theme ---

# Minimal status bar
set -g status-style "bg=#f7f7f7,fg=#777777"
set -g status-left ""
set -g status-right "#[fg=#777777] %H:%M "
set -g status-position bottom

# Window tabs - clean and simple
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#000000,bold] #I:#W "

# Pane borders - subtle
set -g pane-border-style "fg=#dddddd"
set -g pane-active-border-style "fg=#0083b2"

# Message styling
set -g message-style "bg=#bfdcfe,fg=#000000"
